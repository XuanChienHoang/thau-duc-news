name: Daily German News Ingest & AI Publishing

on:
  schedule:
    # Chạy tự động 3 lần mỗi ngày (6:00, 12:00, 18:00 giờ Berlin / CET)
    # Giờ UTC tương ứng: 5:00, 11:00, 17:00 UTC
    - cron: '0 5,11,17 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub bất cứ lúc nào

permissions:
  contents: write

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Editorial Ingest & Gemini AI Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NEXT_PUBLIC_BRAND_ID: ${{ secrets.NEXT_PUBLIC_BRAND_ID || 'thau-duc' }}
          INGEST_MAX_AI: 6
        run: npm run ingest

      - name: Commit & Push New Articles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "Khong co bai viet moi hoac thay doi de commit."
          else
            git commit -m "content: auto-publish German news via Gemini AI [skip ci]"
            git push origin main
          fi

