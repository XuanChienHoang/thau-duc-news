name: Daily German News Ingest & AI Publishing

on:
  schedule:
    # Chạy tự động 3 lần mỗi ngày (6:00, 12:00, 18:00 giờ Berlin / CET)
    # Giờ UTC tương ứng: 5:00, 11:00, 17:00 UTC
    - cron: '0 5,11,17 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub bất cứ lúc nào

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Editorial Ingest & Gemini AI Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NEXT_PUBLIC_BRAND_ID: ${{ secrets.NEXT_PUBLIC_BRAND_ID || 'thau-duc' }}
          INGEST_MAX_AI: 6
        run: npx tsx scripts/cron-ingest.ts
